# The domain below is the real one (api.landwolfonhood.com) and this file is
# ready to copy onto the server as-is.
#
# If you ever change it, change EVERY occurrence: server_name, the $host
# check, both log paths, and the certbot -d flag in the comment below.
# server_name is matched exactly and the block explicitly 444s — drops with
# no response — any request whose Host header does not match. A stale name
# here silently drops every request from the real frontend, which looks like
# a DNS fault or a dead server rather than a one-line mismatch, and burns
# debugging time in entirely the wrong place.
#
# nginx site for api.landwolfonhood.com -> the stats backend on 127.0.0.1:8787
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wolf-api
#   sudo ln -sf /etc/nginx/sites-available/wolf-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.landwolfonhood.com --redirect
#
# certbot rewrites this file in place to add the 443/TLS block and the http->https
# redirect. Do not hand-edit those parts afterwards; re-run certbot instead.
#
# NOTE: this is deliberately NOT a default_server. The box serves one hostname.
# A catch-all would answer for any name pointed at this IP, which is how a
# backend ends up quietly serving a domain it was never meant to.
#
# Ported from the PONSY stats backend (donor: d:\projects\ponsy), same
# proxy_read_timeout — this backend's only wait budget (STATS_WAIT_MS,
# default 5000ms — see .env.example) is pinned well under it by
# config.js's waitBudgetWarning(), and that pin is tested against THIS file
# (test/config.test.js) so the two numbers cannot drift apart silently.

server {
    listen 80;
    listen [::]:80;
    server_name api.landwolfonhood.com;

    # Requests that are not this host get dropped rather than proxied.
    if ($host != api.landwolfonhood.com) { return 444; }

    access_log /var/log/nginx/wolf-api.access.log;
    error_log  /var/log/nginx/wolf-api.error.log;

    # No uploads, no bodies. Anything large is not a real request for this API.
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app bounds every upstream call at UPSTREAM_TIMEOUT_MS (8s
        # default) and runs them all concurrently for one request (see
        # stats.js), so GET /coin/stats is bounded by STATS_WAIT_MS (5s
        # default, see .env.example) well inside this 15s ceiling — the app
        # is designed to answer with its own honest 503 before nginx ever
        # has to time it out itself.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # The app sets its own Cache-Control (max-age=CACHE_TTL_MS/1000 on
        # /coin/stats). Let it through untouched so any CDN in front honours
        # the same window.
        proxy_pass_header Cache-Control;
    }
}
